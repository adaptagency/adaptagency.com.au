    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(5, 15, 14, 0.92);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox-inner img {
      max-width: 92vw;
      max-height: 84vh;
      width: auto;
      height: auto;
      border-radius: 0.5rem;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);

    .lightbox-caption {
      position: absolute;
      left: 50%;
      top: calc(84vh + 0.75rem);
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;

      overflow: hidden;

    .lightbox-counter {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.85rem;

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 44px;

      border-radius: 9999px;
      border: 0;
      background: rgba(255, 255, 255, 0.12);

  <script>
    (function () {
      "use strict";
      var cards = Array.prototype.slice.call(document.querySelectorAll(".gallery-card"));
      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lbImg");
      var lbCap = document.getElementById("lbCap");
      var lbCounter = document.getElementById("lbCounter");
      var lbClose = document.getElementById("lbClose");
      var lbPrev = document.getElementById("lbPrev");
      var lbNext = document.getElementById("lbNext");
      var idx = 0;
      var lastFocus = null;

      function counterText(n, m) {
        var fmt = AdaptAgencyLang.t("lb_counter");
        return String(fmt).replace("{n}", n).replace("{m}", m);
      }

      function show(i) {
        idx = (i + cards.length) % cards.length;
        var card = cards[idx];
        var img = card.querySelector("img");
        var cap = card.querySelector("figcaption");
        lbImg.setAttribute("src", img.getAttribute("src"));
        lbImg.setAttribute("alt", img.getAttribute("alt"));
        lbCap.textContent = cap ? cap.textContent : "";
        lbCounter.textContent = counterText(idx + 1, cards.length);
        lb.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        lb.classList.add("open");
        lbClose.focus();
      }

      function close() {
        lb.classList.remove("open");
        lb.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        if (lastFocus) lastFocus.focus();
      }

      cards.forEach(function (card, i) {
        var trigger = card.querySelector(".gallery-trigger");
        if (!trigger) return;
        var cap = card.querySelector("figcaption");
        if (cap) {
          trigger.setAttribute("aria-label", AdaptAgencyLang.t("lb_enlarge") + ": " + cap.textContent.trim());
        }
        trigger.addEventListener("click", function () {
          lastFocus = trigger;
          show(i);
        });
      });

      lbClose.addEventListener("click", close);
      lbPrev.addEventListener("click", function (e) { e.stopPropagation(); show(idx - 1); });
      lbNext.addEventListener("click", function (e) { e.stopPropagation(); show(idx + 1); });
      lb.addEventListener("click", function (e) { if (e.target === lb) close(); });

      document.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") { close(); return; }
        if (e.key === "ArrowLeft") { show(idx - 1); return; }
        if (e.key === "ArrowRight") { show(idx + 1); return; }
      });
    })();
  </script>
